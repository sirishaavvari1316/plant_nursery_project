<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add New Plant - GreenLeaf Nursery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f4;
        }

        header {
            background: #1b5e20;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin: 8px 0 0;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .add-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1b5e20;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2e7d32;
            font-weight: bold;
        }

        .dashboard {
            display: block;
            text-align: center;
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            color: #1b5e20;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }


        /* =================================
           OWNER LOGIN
        ================================= */

        #ownerLogin {

            position: fixed;
            inset: 0;

            background: #f1f8f4;

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 99999;

        }


        .login-box {

            width: 90%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.15);

        }


        .login-box h2 {

            text-align: center;

            color: #1b5e20;

            margin-bottom: 25px;

        }


        .login-box label {

            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 7px;

        }


        .login-box input {

            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

        }


        .login-btn {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;

        }


        .login-btn:hover {

            background: #1b5e20;

        }


        .forgot-btn {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #2e7d32;

            cursor: pointer;

            font-weight: bold;

        }


        .login-back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #2e7d32;

            text-decoration: none;

            font-weight: bold;

        }


        #loginError,
        #resetError,
        #resetSuccess {

            text-align: center;

            display: none;

            margin-top: 15px;

            font-weight: bold;

        }


        #loginError,
        #resetError {

            color: red;

        }


        #resetSuccess {

            color: #2e7d32;

        }


        /* =================================
           RESET PASSWORD
        ================================= */

        #resetBox {

            display: none;

        }


        .reset-title {

            text-align: center;

            color: #1b5e20;

            margin-bottom: 20px;

        }


        .reset-btn {

            width: 100%;

            margin-top: 20px;

            padding: 13px;

            background: #2e7d32;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 16px;

            cursor: pointer;

        }


        .cancel-reset {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #2e7d32;

            cursor: pointer;

            font-weight: bold;

        }

    </style>

</head>


<body>


<!-- =================================
     OWNER LOGIN
================================= -->

<div id="ownerLogin">

    <div class="login-box">


        <!-- LOGIN BOX -->

        <div id="loginBox">


            <h2 id="loginTitle">
                🔐 Nursery Owner Login
            </h2>


            <label id="usernameLabel">
                Username
            </label>


            <input
                type="text"
                id="ownerUsername"
                placeholder="Enter username"
            >


            <label id="passwordLabel">
                Password
            </label>


            <input
                type="password"
                id="ownerPassword"
                placeholder="Enter password"
            >


            <button
                type="button"
                class="login-btn"
                id="loginButton"
                onclick="ownerLogin()">

                🔐 Login

            </button>


            <span
                class="forgot-btn"
                id="forgotButton"
                onclick="showResetPassword()">

                Forgot Password?

            </span>


            <p id="loginError">
                Incorrect username or password.
            </p>


            <a
                href="index.html"
                class="login-back"
                id="loginBack">

                ← Back to GreenLeaf Nursery

            </a>

        </div>


        <!-- =================================
             RESET PASSWORD BOX
        ================================= -->

        <div id="resetBox">


            <h2
                class="reset-title"
                id="resetTitle">

                🔑 Reset Password

            </h2>


            <label id="securityLabel">

                What is your nursery name?

            </label>


            <input
                type="text"
                id="securityAnswer"
                placeholder="Enter nursery name"
            >


            <label id="newPasswordLabel">

                New Password

            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
            >


            <label id="confirmPasswordLabel">

                Confirm Password

            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
            >


            <button
                type="button"
                class="reset-btn"
                id="resetButton"
                onclick="resetPassword()">

                🔄 Reset Password

            </button>


            <p id="resetError"></p>


            <p id="resetSuccess"></p>


            <span
                class="cancel-reset"
                id="cancelReset"
                onclick="showLogin()">

                ← Back to Login

            </span>


        </div>

    </div>

</div>


<!-- =================================
     EXISTING ADMIN PAGE
================================= -->


<header>

    <h1>🌿 GreenLeaf Nursery</h1>

    <p data-admin-lang="adminPanel">
        Admin Panel - Add New Plant
    </p>

</header>


<div class="container">

    <h2 data-admin-lang="addNewPlant">
        🌱 Add New Plant
    </h2>


    <form id="plantForm">


        <!-- PLANT NAME -->

        <label for="plantName"
               data-admin-lang="plantName">

            Plant Name

        </label>


        <input
            type="text"
            id="plantName"
            placeholder="Enter plant name"
            data-admin-placeholder="plantNamePlaceholder"
            required
        >


        <!-- CATEGORY -->

        <label
            for="category"
            data-admin-lang="category">

            Category

        </label>


        <select
            id="category"
            required
        >

            <option
                value=""
                data-admin-lang="selectCategory">

                Select Category

            </option>


            <option
                value="Indoor Plant"
                data-admin-lang="indoorPlantCategory">

                Indoor Plant

            </option>


            <option
                value="Outdoor Plant"
                data-admin-lang="outdoorPlantCategory">

                Outdoor Plant

            </option>


            <option
                value="Flowering Plant"
                data-admin-lang="floweringPlantCategory">

                Flowering Plant

            </option>


            <option
                value="Medicinal Plant"
                data-admin-lang="medicinalPlantCategory">

                Medicinal Plant

            </option>


            <option
                value="Other Countries"
                data-admin-lang="otherCountriesCategory">

                Other Countries

            </option>

        </select>


        <!-- PRICE -->

        <label
            for="price"
            data-admin-lang="price">

            Price

        </label>


        <input
            type="number"
            id="price"
            placeholder="Enter price"
            data-admin-placeholder="pricePlaceholder"
            required
        >


        <!-- IMAGE -->

        <label
            for="image"
            data-admin-lang="plantImageURL">

            Plant Image URL

        </label>


        <input
            type="url"
            id="image"
            placeholder="https://..."
            data-admin-placeholder="imagePlaceholder"
            required
        >


        <!-- SUNLIGHT -->

        <label
            for="sunlight"
            data-admin-lang="sunlight">

            Sunlight

        </label>


        <input
            type="text"
            id="sunlight"
            placeholder="Example: Full Sun"
            data-admin-placeholder="sunlightPlaceholder"
            required
        >


        <!-- WATERING -->

        <label
            for="watering"
            data-admin-lang="watering">

            Watering

        </label>


        <input
            type="text"
            id="watering"
            placeholder="Example: Moderate"
            data-admin-placeholder="wateringPlaceholder"
            required
        >


        <!-- DISEASES -->

        <label
            for="diseases"
            data-admin-lang="diseases">

            Diseases

        </label>


        <input
            type="text"
            id="diseases"
            placeholder="Example: Leaf Spot"
            data-admin-placeholder="diseasesPlaceholder"
        >


        <!-- DESCRIPTION -->

        <label
            for="description"
            data-admin-lang="description">

            Description

        </label>


        <textarea
            id="description"
            placeholder="Enter plant description"
            data-admin-placeholder="descriptionPlaceholder"
            required
        ></textarea>


        <!-- ADD BUTTON -->

        <button
            type="submit"
            class="add-btn"
            data-admin-lang="addPlant">

            🌱 Add Plant

        </button>


    </form>


    <!-- DASHBOARD -->

    <a
        href="admin-dashboard.html"
        class="dashboard"
        data-admin-lang="openDashboard">

        📊 Open Admin Dashboard

    </a>


    <!-- BACK -->

    <a
        href="index.html"
        class="back"
        data-admin-lang="backGreenLeaf">

        ← Back to GreenLeaf Nursery

    </a>


</div>

// =================================
// SHOW LOGIN
// =================================

function showLogin() {

    document.getElementById(
        "resetBox"
    ).style.display = "none";


    document.getElementById(
        "loginBox"
    ).style.display = "block";


    document.getElementById(
        "resetError"
    ).style.display = "none";


    document.getElementById(
        "resetSuccess"
    ).style.display = "none";

}


// =================================
// OWNER LOGIN
// =================================

function ownerLogin() {

    const username =
        document
        .getElementById("ownerUsername")
        .value
        .trim();


    const password =
        document
        .getElementById("ownerPassword")
        .value;


    const savedPassword =
        localStorage.getItem(
            "greenleafOwnerPassword"
        ) || "greenleaf123";


    if (
        username === "admin" &&
        password === savedPassword
    ) {

        sessionStorage.setItem(
            "greenleafOwnerLoggedIn",
            "true"
        );


        document.getElementById(
            "ownerLogin"
        ).style.display = "none";


    }
    else {

        const error =
            document.getElementById(
                "loginError"
            );


        error.style.display = "block";

    }

}


// =================================
// RESET PASSWORD
// =================================

function resetPassword() {

    const language =
        localStorage.getItem(
            "selectedLanguage"
        ) || "en";


    const t =
        ownerLoginTranslations[
            language
        ] || ownerLoginTranslations.en;


    const answer =
        document
        .getElementById("securityAnswer")
        .value
        .trim();


    const newPassword =
        document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    const resetError =
        document.getElementById(
            "resetError"
        );


    const resetSuccess =
        document.getElementById(
            "resetSuccess"
        );


    resetError.style.display = "none";

    resetSuccess.style.display = "none";


    /* Security Answer */

    if (
        answer.toLowerCase() !==
        "greenleaf"
    ) {

        resetError.textContent =
            t.wrongAnswer;

        resetError.style.display =
            "block";

        return;

    }


    /* Password Length */

    if (
        newPassword.length < 6
    ) {

        resetError.textContent =
            t.passwordShort;

        resetError.style.display =
            "block";

        return;

    }


    /* Password Match */

    if (
        newPassword !==
        confirmPassword
    ) {

        resetError.textContent =
            t.passwordMismatch;

        resetError.style.display =
            "block";

        return;

    }


    /* SAVE NEW PASSWORD */

    localStorage.setItem(
        "greenleafOwnerPassword",
        newPassword
    );


    resetSuccess.textContent =
        t.resetSuccess;


    resetSuccess.style.display =
        "block";


    document.getElementById(
        "securityAnswer"
    ).value = "";


    document.getElementById(
        "newPassword"
    ).value = "";


    document.getElementById(
        "confirmPassword"
    ).value = "";


    setTimeout(
        function() {

            showLogin();

        },
        1800
    );

}


// =================================
// ENTER KEY LOGIN
// =================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        document
        .getElementById("ownerPassword")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    ownerLogin();

                }

            }
        );

    }
);


// =================================
// APPLY ADMIN LANGUAGE
// =================================

function applyAdminLanguage(language) {

    const selectedLanguage =
        adminTranslations[language]
        ? language
        : "en";


    document
    .querySelectorAll(
        "[data-admin-lang]"
    )
    .forEach(
        function(element) {

            const key =
                element.getAttribute(
                    "data-admin-lang"
                );


            if (
                adminTranslations[
                    selectedLanguage
                ][key]
            ) {

                element.textContent =
                    adminTranslations[
                        selectedLanguage
                    ][key];

            }

        }
    );


    document
    .querySelectorAll(
        "[data-admin-placeholder]"
    )
    .forEach(
        function(element) {

            const key =
                element.getAttribute(
                    "data-admin-placeholder"
                );


            if (
                adminPlaceholders[
                    selectedLanguage
                ][key]
            ) {

                element.placeholder =
                    adminPlaceholders[
                        selectedLanguage
                    ][key];

            }

        }
    );


    document.documentElement.lang =
        selectedLanguage;


    if (
        selectedLanguage === "te"
    ) {

        document.title =
            "కొత్త మొక్కను జోడించండి - GreenLeaf Nursery";

    }

    else if (
        selectedLanguage === "hi"
    ) {

        document.title =
            "नया पौधा जोड़ें - GreenLeaf Nursery";

    }

    else {

        document.title =
            "Add New Plant - GreenLeaf Nursery";

    }


    applyOwnerLoginLanguage();

}


// =================================
// PAGE LOAD
// =================================

document.addEventListener(
    "DOMContentLoaded",
    function() {


        const savedLanguage =
            localStorage.getItem(
                "selectedLanguage"
            ) || "en";


        applyAdminLanguage(
            savedLanguage
        );


        const loggedIn =
            sessionStorage.getItem(
                "greenleafOwnerLoggedIn"
            );


        if (
            loggedIn === "true"
        ) {

            document.getElementById(
                "ownerLogin"
            ).style.display = "none";

        }

        else {

            document.getElementById(
                "ownerLogin"
            ).style.display = "flex";

        }

    }
);


// =================================
// LANGUAGE CHANGE
// =================================

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key ===
            "selectedLanguage"
        ) {

            applyAdminLanguage(
                event.newValue || "en"
            );

        }

    }
);

</script>


<script>


// =================================
// ADD NEW PLANT
// =================================

document
.getElementById("plantForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        // ===============================
        // CREATE PLANT OBJECT
        // ===============================

        const plant = {

            id:
                Date.now(),

            name:
                document
                .getElementById("plantName")
                .value
                .trim(),

            category:
                document
                .getElementById("category")
                .value,

            price:
                document
                .getElementById("price")
                .value,

            image:
                document
                .getElementById("image")
                .value
                .trim(),

            sunlight:
                document
                .getElementById("sunlight")
                .value
                .trim(),

            watering:
                document
                .getElementById("watering")
                .value
                .trim(),

            diseases:
                document
                .getElementById("diseases")
                .value
                .trim(),

            description:
                document
                .getElementById("description")
                .value
                .trim()

        };


        // ===============================
        // GET EXISTING PLANTS
        // ===============================

        let plants =
            JSON.parse(
                localStorage.getItem(
                    "greenleafPlants"
                )
            ) || [];


        // ===============================
        // ADD NEW PLANT
        // ===============================

        plants.push(plant);


        // ===============================
        // SAVE TO LOCAL STORAGE
        // ===============================

        localStorage.setItem(
            "greenleafPlants",
            JSON.stringify(plants)
        );


        // ===============================
        // RESET FORM
        // ===============================

        document
        .getElementById("plantForm")
        .reset();


        // No alert popup.
        // Plant is added directly.

    }
);

</script>
