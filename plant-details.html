    <title>Plant Details - GreenLeaf Nursery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8f3;
            color: #333;
        }

        header {
            background: #176b3a;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* LANGUAGE SELECTOR - ADDED */

        .language-box {
            margin-left: 15px;
            display: inline-block;
        }

        .language-box select {
            padding: 8px 12px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            background: white;
            color: #176b3a;
        }

        .details-container {
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .details-content {
            display: flex;
            gap: 40px;
            align-items: center;
            flex-wrap: wrap;
        }

        .details-image {
            flex: 1;
            min-width: 300px;
            text-align: center;
        }

        .details-image img {
            width: 100%;
            max-width: 430px;
            height: 430px;
            object-fit: cover;
            border-radius: 15px;
        }

        .details-info {
            flex: 1;
            min-width: 300px;
        }

        .details-info h2 {
            color: #176b3a;
            font-size: 34px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 26px;
            font-weight: bold;
            color: #e67e22;
            margin: 15px 0;
        }

        .description {
            font-size: 17px;
            line-height: 1.7;
        }

        .info-box {
            background: #f1f8f3;
            padding: 18px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .info-box p {
            margin: 10px 0;
            font-size: 16px;
            line-height: 1.5;
        }

        .info-box strong {
            color: #176b3a;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .cart-btn {
            background: #176b3a;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #333;
        }

        footer {
            margin-top: 50px;
            background: #176b3a;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .error {
            text-align: center;
            padding: 50px;
        }

        @media (max-width: 700px) {

            header {
                padding: 15px;
                text-align: center;
                justify-content: center;
                gap: 15px;
            }

            .details-container {
                margin: 20px;
                padding: 20px;
            }

            .details-image img {
                height: 300px;
            }

            .details-info h2 {
                font-size: 28px;
            }

            .language-box {
                margin-top: 10px;
                margin-left: 0;
            }

        }

    </style>

</head>

/* =========================================
   GET CURRENT LANGUAGE
========================================= */

function getLanguage() {

    return localStorage.getItem("greenLeafLanguage") || "en";

}


/* =========================================
   CHANGE LANGUAGE
========================================= */

function changeLanguage() {

    var language =
        document.getElementById("languageSelect").value;

    localStorage.setItem(
        "greenLeafLanguage",
        language
    );

    applyLanguage();

    loadPlantDetails();

}


/* =========================================
   APPLY LANGUAGE TO HEADER
========================================= */

function applyLanguage() {

    var language = getLanguage();

    var t = translations[language];

    document
        .querySelectorAll("[data-lang]")
        .forEach(function(element) {

            var key =
                element.getAttribute("data-lang");

            if (t[key]) {

                element.textContent =
                    t[key];

            }

        });

    var selector =
        document.getElementById("languageSelect");

    if (selector) {

        selector.value = language;

    }

}


/* =========================================
   GET SELECTED PLANT
========================================= */

function loadPlantDetails() {

    var data =
        localStorage.getItem("selectedPlant");

    if (!data) {

        var t = translations[getLanguage()];

        document.getElementById("plantDetails").innerHTML = `

            <div class="error">

                <h2>
                    ${t.detailsNotFound}
                </h2>

                <p>
                    ${t.goBackSelect}
                </p>

                <button
                    class="back-btn"
                    onclick="goBack()">

                    ${t.back}

                </button>

            </div>

        `;

        return;
    }


    var plant;

    try {

        plant =
            JSON.parse(data);

    }

    catch (error) {

        var t = translations[getLanguage()];

        document.getElementById("plantDetails").innerHTML = `

            <div class="error">

                <h2>
                    ${t.somethingWrong}
                </h2>

                <p>
                    ${t.selectAgain}
                </p>

                <button
                    class="back-btn"
                    onclick="goBack()">

                    ${t.back}

                </button>

            </div>

        `;

        return;

    }


    showPlant(plant);

}

/* =========================================
   ADD TO CART
========================================= */

function addPlantToCart() {

    var data =
        localStorage.getItem("selectedPlant");

    if (!data) {

        alert("Plant details not found!");

        return;
    }

    var plant =
        JSON.parse(data);

    var cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];

    cart.push(plant);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    window.location.href =
        "cart.html";

}


/* =========================================
   BACK BUTTON
========================================= */

function goBack() {

    window.history.back();

}


/* =========================================
   PAGE LOAD
========================================= */

window.onload = function () {

    var savedLanguage =
        localStorage.getItem(
            "greenLeafLanguage"
        ) || "en";


    var selector =
        document.getElementById(
            "languageSelect"
        );


    if (selector) {

        selector.value =
            savedLanguage;

    }


    applyLanguage();

    loadPlantDetails();

};

</script>
